<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>小秋 · 状态</title>
    <style>
        /* ================= 全局重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #d1d9e0;
        }

        /* 蜘蛛网 Canvas 背景 */
        #web-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 居中容器 */
        .wrapper {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ================= 大标题 ================= */
        .main-title {
            font-family: "KaiTi", "STKaiti", "楷体", serif;
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 10px;
            margin-bottom: 25px;
            margin-left: 10px; /* 修正字间距带来的偏移 */
            background: linear-gradient(180deg, #ffffff 0%, #e5c07b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(229, 192, 123, 0.3);
            animation: title-pulse 3s infinite alternate;
            cursor: pointer;
        }

        @keyframes title-pulse {
            0% { transform: scale(0.98); opacity: 0.9; }
            100% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 30px rgba(229, 192, 123, 0.6); }
        }

        /* ================= 状态面板 ================= */
        .panel {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 12px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
        }

        /* 背景水印 */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 110px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 15px;
            z-index: 0;
        }

        .line {
            margin-bottom: 22px;
            font-size: 15px;
            display: flex;
            line-height: 1.5;
            letter-spacing: 0.5px;
            z-index: 2;
            position: relative;
        }
        
        .line:last-child { margin-bottom: 0; }
        
        .arrow { color: #8c9ba8; margin-right: 10px; }
        .key { color: #e5c07b; font-weight: bold; margin-right: 5px; white-space: nowrap; }
        .val { color: #d1d9e0; word-break: break-all; }
        .highlight { color: #e5c07b; }
        
        /* 光标闪烁效果 */
        .cursor::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: #e5c07b;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ================= 启动按钮 ================= */
        .btn-launch {
            padding: 15px 40px;
            background: rgba(229, 192, 123, 0.1);
            border: 1px solid rgba(229, 192, 123, 0.5);
            border-radius: 30px;
            color: #e5c07b;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-launch:hover, .btn-launch:active {
            background: rgba(229, 192, 123, 0.3);
            border-color: #e5c07b;
            color: #fff;
            box-shadow: 0 0 20px rgba(229, 192, 123, 0.4);
            transform: translateY(-2px);
        }

        /* 按钮扫光 */
        .btn-launch::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-20deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

    </style>
</head>
<body>

    <!-- 蜘蛛网背景 -->
    <canvas id="web-bg"></canvas>

    <!-- 居中容器 -->
    <div class="wrapper">
        
        <!-- 大标题 -->
        <div class="main-title" onclick="launchGame()">小 秋</div>

        <!-- 状态面板 -->
        <div class="panel">
            <div class="watermark">小秋</div>
            <div class="line"><span class="arrow">></span><span class="key">状态：</span><span class="val highlight" id="l1"></span></div>
            <div class="line"><span class="arrow">></span><span class="key">公告：</span><span class="val" id="l2"></span></div>
            <div class="line"><span class="arrow">></span><span class="key">注意：</span><span class="val" id="l3"></span></div>
            <div class="line"><span class="arrow">></span><span class="key">祝：</span><span class="val" id="l4"></span></div>
            <div class="line"><span class="arrow">></span><span class="key">时间：</span><span class="val highlight" id="l5"></span></div>
        </div>

        <!-- 启动按钮 -->
        <div class="btn-launch" id="btn-launch" onclick="launchGame()">
            上 游 戏
        </div>

    </div>

    <script>
        // =====================================================================
        // 模块一：蜘蛛网 Canvas 特效
        // =====================================================================
        const canvas = document.getElementById('web-bg');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        const particleCount = 70; 
        const maxDistance = 140;  

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', initCanvas);
        initCanvas();

        // 鼠标位置交互
        let mouse = { x: null, y: null, radius: 150 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.size = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                // 轻微排斥
                if (mouse.x != null && mouse.y != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        this.x -= dx / dist * 1.0;
                        this.y -= dy / dist * 1.0;
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(229, 192, 123, 0.4)'; 
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        let opacity = 1 - (dist / maxDistance);
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(229, 192, 123, ${opacity * 0.2})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            // 鼠标连线
            if (mouse.x != null && mouse.y != null) {
                particles.forEach(p => {
                    let dx = mouse.x - p.x;
                    let dy = mouse.y - p.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius) {
                        let opacity = 1 - (dist / mouse.radius);
                        ctx.beginPath();
                        ctx.moveTo(mouse.x, mouse.y);
                        ctx.lineTo(p.x, p.y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                });
            }

            requestAnimationFrame(animate);
        }

        animate();

        // =====================================================================
        // 模块二：打字机特效逻辑
        // =====================================================================
        
        // 格式化时间
        function getTime() {
            const now = new Date();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const hours = now.getHours();
            const ampm = hours >= 12 ? (hours >= 18 ? '晚上' : '下午') : '上午';
            const h12 = hours % 12 || 12;
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            return `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]} ${ampm}${h12}:${m}:${s}`;
        }

        // 要打出的文本 (完全保留原版)
        const lines = [
            { id: 'l1', text: '正常' },
            { id: 'l2', text: '演戏=战神 | 乱杀=封号' },
            { id: 'l3', text: '高段位请人头控制15以内' },
            { id: 'l4', text: '大家百榜上见' },
            { id: 'l5', text: getTime() }
        ];

        // 动态计算打字速度 (目标 4秒内打完)
        let totalChars = 0;
        lines.forEach(line => totalChars += line.text.length);
        const targetDuration = 3500; 
        const typingSpeed = targetDuration / totalChars;

        let currentLine = 0;
        let currentChar = 0;
        let currentEl = null;

        function typeWriter() {
            if (currentLine >= lines.length) {
                document.getElementById('l5').classList.remove('cursor');
                // 时间实时刷新
                setInterval(() => {
                    document.getElementById('l5').innerText = getTime();
                }, 1000);
                return;
            }

            if (currentChar === 0) {
                if (currentEl) currentEl.classList.remove('cursor');
                currentEl = document.getElementById(lines[currentLine].id);
                currentEl.classList.add('cursor');
                currentEl.innerText = '';
            }

            const text = lines[currentLine].text;
            if (currentChar < text.length) {
                currentEl.innerText += text.charAt(currentChar);
                currentChar++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                currentLine++;
                currentChar = 0;
                setTimeout(typeWriter, typingSpeed * 3); // 换行间稍微停顿
            }
        }

        // 启动打字机
        window.addEventListener('load', () => {
            setTimeout(typeWriter, 200);
        });

        // =====================================================================
        // 模块三：拉起游戏逻辑
        // =====================================================================
        function launchGame() {
            const btn = document.getElementById('btn-launch');
            btn.innerText = "正在注入...";
            
            setTimeout(() => {
                btn.innerText = "启动游戏中...";
                
                // iOS / Android 拉起和平精英的 Scheme (原版保留)
                const schemes = [
                    "tencentlaunch1120://",
                    "com.tencent.tmgp.pubgmhd://",
                    "pubgmhd://"
                ];

                let i = 0;
                function tryScheme() {
                    if (i < schemes.length) {
                        window.location.href = schemes[i];
                        i++;
                        setTimeout(tryScheme, 500);
                    } else {
                        btn.innerText = "未检测到游戏";
                        btn.style.color = "#ff3b30";
                        btn.style.borderColor = "#ff3b30";
                        // 恢复按钮
                        setTimeout(() => {
                            btn.innerText = "上 游 戏";
                            btn.style.color = "#e5c07b";
                            btn.style.borderColor = "rgba(229, 192, 123, 0.5)";
                        }, 3000);
                    }
                }
                tryScheme();
            }, 1000);
        }
    </script>
</body>
</html>
