<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWN 极客控制台</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #050505;
    color: #fff;
    font-family: 'Orbitron', 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 科技感网格背景 */
  .bg-grid {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 30px 30px; z-index: 1; opacity: 0.5;
    animation: gridMove 10s linear infinite;
  }
  @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(30px); } }

  /* ================= 入场动画遮罩层 (保留) ================= */
  #intro-layer {
    position: absolute; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; height: 100%; background: #050505;
    transition: opacity 1.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .glitch-text { font-size: 3rem; font-weight: 700; color: #0ff; text-shadow: 0 0 10px #0ff; letter-spacing: 5px; margin-bottom: 20px; }
  .loading-bar { width: 200px; height: 2px; background: #333; position: relative; overflow: hidden; }
  .loading-bar::after { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: #0ff; box-shadow: 0 0 10px #0ff; animation: load 2s ease-in-out forwards; }
  @keyframes load { 0% { width: 0%; } 50% { width: 60%; } 100% { width: 100%; } }

  /* ================= 主内容层 (控制台) ================= */
  #main-layer {
    position: absolute; z-index: 5; width: 90%; max-width: 1200px;
    opacity: 0; transform: scale(0.9) translateY(20px);
    transition: opacity 1.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex; flex-direction: column; gap: 20px;
  }

  /* 顶部时钟区 */
  .header { text-align: center; margin-bottom: 20px; }
  .clock { font-size: 4rem; font-weight: 700; color: #fff; text-shadow: 0 0 15px rgba(0, 255, 255, 0.5); letter-spacing: 4px; }
  .date { font-size: 1rem; color: #aaa; letter-spacing: 3px; margin-top: 5px; }

  /* 功能卡片网格 */
  .tools-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  
  .card {
    background: rgba(20, 20, 20, 0.8);
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  .card:hover { border-color: #0ff; box-shadow: 0 0 25px rgba(0, 255, 255, 0.3); }
  
  .card h3 { color: #0ff; font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 255, 255, 0.2); padding-bottom: 8px; }

  /* 输入框与按钮通用样式 */
  input[type="text"], input[type="number"], textarea {
    width: 100%; background: #000; border: 1px solid #333; color: #0f0;
    padding: 10px; font-family: monospace; border-radius: 5px; margin-bottom: 10px; outline: none;
  }
  input:focus, textarea:focus { border-color: #0ff; }
  
  button {
    background: rgba(0, 255, 255, 0.1); border: 1px solid #0ff; color: #0ff;
    padding: 8px 15px; cursor: pointer; border-radius: 5px; font-family: 'Orbitron', sans-serif;
    transition: 0.2s; width: 100%; font-weight: bold;
  }
  button:hover { background: #0ff; color: #000; box-shadow: 0 0 10px #0ff; }
  button:active { transform: scale(0.98); }

  .result-box { background: #111; border: 1px dashed #555; padding: 10px; color: #fff; font-size: 0.9rem; text-align: center; margin-top: 10px; word-break: break-all; }

  /* 动画控制类 */
  .fade-out { opacity: 0 !important; transform: scale(1.2) !important; pointer-events: none; }
  .fade-in { opacity: 1 !important; transform: scale(1) translateY(0) !important; }

  @media (max-width: 768px) { .clock { font-size: 2.5rem; } .glitch-text { font-size: 2rem; } }
</style>
</head>
<body>

  <div class="bg-grid"></div>

  <!-- 入场动画层 -->
  <div id="intro-layer">
    <div class="glitch-text" id="glitch-text">初始化系统...</div>
    <div class="loading-bar"></div>
  </div>

  <!-- 主控制台 -->
  <div id="main-layer">
    <div class="header">
      <div class="clock" id="time">00:00:00</div>
      <div class="date" id="date">2024-01-01</div>
    </div>

    <div class="tools-grid">
      <!-- 功能1：密码生成器 -->
      <div class="card">
        <h3>🔐 高强度密码生成器</h3>
        <input type="number" id="pwd-length" value="16" min="6" max="64" placeholder="密码长度 (6-64)">
        <button onclick="genPassword()">生成密码</button>
        <div class="result-box" id="pwd-result">点击上方按钮生成</div>
      </div>

      <!-- 功能2：时间戳转换 -->
      <div class="card">
        <h3>⏱️ 时间戳转换器</h3>
        <input type="text" id="timestamp-input" placeholder="输入10位/13位时间戳，留空则取当前">
        <button onclick="convertTime()">转换</button>
        <div class="result-box" id="time-result">等待输入...</div>
      </div>

      <!-- 功能3：本地便签 -->
      <div class="card">
        <h3>📝 本地安全便签</h3>
        <textarea id="note-input" rows="4" placeholder="随手记点什么，自动保存在浏览器本地..." oninput="saveNote()"></textarea>
        <button onclick="clearNote()" style="border-color: #f00; color: #f00; background: rgba(255,0,0,0.1);">清空便签</button>
      </div>
    </div>
  </div>

<script>
  // ================= 1. 入场动画逻辑 =================
  const glitchText = document.getElementById('glitch-text');
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*';
  const targetText = '访问已授权';
  let iterations = 0;

  const interval = setInterval(() => {
    glitchText.innerText = glitchText.innerText.split('').map((char, index) => {
      if (index < iterations) return targetText[index];
      return chars[Math.floor(Math.random() * chars.length)];
    }).join('');
    if (iterations >= targetText.length) clearInterval(interval);
    iterations += 1 / 3;
  }, 50);

  setTimeout(() => {
    const intro = document.getElementById('intro-layer');
    const main = document.getElementById('main-layer');
    intro.classList.add('fade-out');
    main.classList.add('fade-in');
    setTimeout(() => { intro.style.display = 'none'; }, 1500);
  }, 2800);

  // ================= 2. 时钟逻辑 =================
  function updateTime() {
    const now = new Date();
    const bjTimeStr = now.toLocaleString('en-US', { timeZone: 'Asia/Shanghai', hour12: false });
    const bjDate = new Date(bjTimeStr);
    const h = String(bjDate.getHours()).padStart(2, '0');
    const m = String(bjDate.getMinutes()).padStart(2, '0');
    const s = String(bjDate.getSeconds()).padStart(2, '0');
    document.getElementById('time').innerText = `${h}:${m}:${s}`;
    document.getElementById('date').innerText = `${bjDate.getFullYear()}-${String(bjDate.getMonth()+1).padStart(2,'0')}-${String(bjDate.getDate()).padStart(2,'0')}`;
  }
  updateTime(); setInterval(updateTime, 1000);

  // ================= 3. 功能1：密码生成 =================
  function genPassword() {
    const len = parseInt(document.getElementById('pwd-length').value) || 16;
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
    let pwd = "";
    for (let i = 0; i < len; i++) { pwd += chars.charAt(Math.floor(Math.random() * chars.length)); }
    document.getElementById('pwd-result').innerText = pwd;
    // 自动复制到剪贴板
    navigator.clipboard.writeText(pwd).then(() => {
      const box = document.getElementById('pwd-result');
      const oldText = box.innerText;
      box.innerText = "✅ 已复制到剪贴板: " + oldText;
      setTimeout(() => { box.innerText = oldText; }, 2000);
    });
  }

  // ================= 4. 功能2：时间戳转换 =================
  function convertTime() {
    let ts = document.getElementById('timestamp-input').value.trim();
    if (!ts) ts = Date.now(); // 为空取当前
    // 如果输入的是10位(秒)，转成毫秒
    if (ts.length === 10) ts = ts * 1000;
    
    const d = new Date(parseInt(ts));
    if (isNaN(d.getTime())) {
      document.getElementById('time-result').innerText = "❌ 格式错误，请输入纯数字";
      return;
    }
    const res = d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
    document.getElementById('time-result').innerText = "北京时间: " + res;
  }

  // ================= 5. 功能3：本地便签 =================
  const noteInput = document.getElementById('note-input');
  // 启动时加载
  window.onload = () => { noteInput.value = localStorage.getItem('my_secret_note') || ""; };
  // 实时保存
  function saveNote() { localStorage.setItem('my_secret_note', noteInput.value); }
  // 清空
  function clearNote() { 
    if(confirm("确定要清空便签吗？")) {
      noteInput.value = ""; 
      localStorage.removeItem('my_secret_note'); 
    }
  }
</script>

</body>
</html>
