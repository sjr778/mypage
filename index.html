<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的网页</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;padding:48px 56px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center;max-width:420px}
  h1{font-size:28px;color:#333;margin-bottom:12px}
  p{color:#666;line-height:1.7;margin-bottom:24px}
  button{padding:12px 32px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;cursor:pointer}
  #out{margin-top:18px;color:#764ba2;font-weight:600;min-height:24px}
</style>
</head>
<body>
  <div class="card">
    <h1>你好，爸爸 👋</h1>
    <p>这是一个可以直接双击打开的网页。</p>
    <button onclick="sayHi()">点我</button>
    <div id="out"></div>
  </div>
<script>
  function sayHi(){
    document.getElementById('out').textContent =
      '按钮生效了！当前时间：' + new Date().toLocaleTimeString();
  }
</script>
</body>
</html>
